```

</div>

<nav>
    <button id="nav-camera" class="active" onclick="showView('camera')">Camera</button>
    <button id="nav-batch" onclick="showView('batch')">Batch</button>
</nav>

<script>
let state = {
    photos: [],
    facingMode: 'environment',
    stream: null,
    cropper: null
};

async function startCamera() {
    try {
        if (state.stream) state.stream.getTracks().forEach(t => t.stop());

        state.stream = await navigator.mediaDevices.getUserMedia({
            video: { facingMode: state.facingMode }
        });

        const video = document.getElementById('video');
        video.srcObject = state.stream;
        await video.play();
    } catch (e) {
        alert("Camera error: " + e.message);
    }
}

function flipCamera() {
    state.facingMode = state.facingMode === 'environment' ? 'user' : 'environment';
    startCamera();
}

function capturePhoto() {
    const video = document.getElementById('video');
    const canvas = document.createElement('canvas');
    canvas.width = video.videoWidth;
    canvas.height = video.videoHeight;

    const ctx = canvas.getContext('2d');
    ctx.drawImage(video, 0, 0);

    initCrop(canvas.toDataURL('image/jpeg'));
}

function initCrop(src) {
    showView('crop');

    const img = document.getElementById('crop-target');
    img.src = src;

    if (state.cropper) state.cropper.destroy();

    img.onload = () => {
        state.cropper = new Cropper(img, {
            viewMode: 1
        });
    };
}

function cancelCrop() {
    showView('camera');
}

function saveCrop() {
    const canvas = state.cropper.getCroppedCanvas();
    state.photos.push(canvas.toDataURL('image/jpeg'));

    updateUI();
    showView('camera');
}

function showView(view) {
    ['camera','crop','batch'].forEach(v => {
        document.getElementById('view-' + v).style.display = 'none';
    });

    document.getElementById('view-' + view).style.display =
        (view === 'camera' || view === 'crop') ? 'flex' : 'block';

    ['camera','batch'].forEach(v => {
        const btn = document.getElementById('nav-' + v);
        if (btn) btn.classList.remove('active');
    });

    const active = document.getElementById('nav-' + view);
    if (active) active.classList.add('active');

    if (view === 'camera') startCamera();
    if (view === 'batch') renderBatch();
}

function updateUI() {}

function renderBatch() {
    const grid = document.getElementById('batch-grid');
    grid.innerHTML = '';

    state.photos.forEach((p,i) => {
        const div = document.createElement('div');
        div.innerHTML = `<img src="${p}" style="width:100%">`;
        grid.appendChild(div);
    });
}

function clearBatch() {
    state.photos = [];
    renderBatch();
}

async function exportToPPTX() {
    const pptx = new PptxGenJS();

    state.photos.forEach(img => {
        let slide = pptx.addSlide();
        slide.addImage({ data: img, x:0, y:0, w:10, h:5.6 });
    });

    pptx.writeFile("batch.pptx");
}

/* FIXED SERVICE WORKER */
if ('serviceWorker' in navigator) {
    navigator.serviceWorker.register('./service-worker.js');
}

/* FIXED CAMERA START (USER CLICK REQUIRED) */
document.addEventListener('DOMContentLoaded', () => {
    document.body.addEventListener('click', () => {
        startCamera();
    }, { once:true });
});
</script>

</body>
